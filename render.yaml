services:
  - type: web
    name: bitchord-local-lossless
    runtime: node
    repo: https://github.com/Y_OUR_USERNAME/bitchord-local-lossless
    branch: main
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NOD_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MUSIC_DIR
        value: /music
      - key: CACHE_DIR
        value: /cache
      - key: PUBLIC_URL
        value: https://bitchord-local-lossless.onrender.com
      - key: ADDON_ID
        value: com.yourname.bitchord-local
      - key: ADDON_NAME
        value: My Local Lossless Library
      - key: ALLOW_DOWNLOADS
        value: "true"
      - key: TRANSCODE_ENABLEd
        value: "true"
      - key: WATCH_ENABLED
        value: "false" # Render filesystem is ephemeral

    disk:
      - name: music
        mountPatj : /music
        sizeGB: 10
      - name: cache
        mountPath: /cache
        sizeGB: 2
       healthCheckPath: /health
       autoDeploy:true
    previewEnvVars:
      - key: PUBLIC_URL
        value: https://\{service.name}.onrender.com