services:
  - type: web
    name: bitchord-local-lossless
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MUSIC_DIR
        value: /music
      - key: CACHE_DIR
        value: /cache
      - key: TRANSCODE_ENABLED
        value: "true"
      - key: WATCH_ENABLED
        value: "false" # Render mounts a persistent disk, watching does not survive restarts
      - key: ACCESS_TOKEN
        generateValue: true
    disks:
      - name: music
        mountPath: /music
        sizeGB: 10
      - name: cache
        mountPath: /cache
        sizeGB: 2
